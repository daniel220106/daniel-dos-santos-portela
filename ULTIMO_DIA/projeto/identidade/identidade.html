<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Oswald;font-weight:400;src:url(../fontes/oswald-latin-400-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(../fontes/oswald-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../fontes/inter-latin-600-normal.woff2)}
body{margin:0;background:#000}
</style></head><body>
<script>window.EPISODIO = true;</script>
<script src="../motor/motor.js"></script>
<script src="../ep01/abertura.js"></script>
<script>
// Identidade visual do canal: capa (2560x1440) e foto de perfil (800x800)
const NOME = new URLSearchParams(location.search).get('nome') || 'ÚLTIMO DIA';
const LEMA = 'SIMULAÇÕES DE SOBREVIVÊNCIA  ·  E SE FOSSE COM VOCÊ?';

function fundoCidade(c, {base1, alt1, base2, alt2, corte}) {
  // céu: noite com o brilho alaranjado do horizonte
  c.fillStyle = vgrad(c, 0, H, [[0, '#050506'], [0.45, '#13070a'], [0.66, '#3e130c'], [0.8, '#6a2112'], [1, '#160605']]); c.fillRect(0, 0, W, H);
  c.fillStyle = rgrad(c, W * 0.5, base1 + 40, 0, 1000, [[0, 'rgba(232,121,43,0.42)'], [1, 'rgba(232,121,43,0)']]); c.fillRect(0, 0, W, H);
  const r = rng(3);
  for (let i = 0; i < 140; i++) { c.globalAlpha = 0.15 + r() * 0.5; c.fillStyle = '#f2efe9'; c.fillRect(r() * W, r() * (base1 - alt1), 1.6, 1.6); }
  c.globalAlpha = 1;
  // metade da cidade ainda acesa, metade já apagada
  const camada = (seed, base, alt, cor, jan) => {
    c.save(); c.beginPath(); c.rect(-400, -2000, corte + 400, 5000); c.clip();
    skyline(c, seed, base, alt, cor, {janelas: jan, corJanela: '#f0a45a'}); c.restore();
    c.save(); c.beginPath(); c.rect(corte, -2000, W + 400, 5000); c.clip();
    skyline(c, seed, base, alt, cor, {janelas: 0}); c.restore();
  };
  camada(11, base1, alt1, '#170809', 0.3);
  camada(12, base2, alt2, '#080405', 0.18);
  particulas(c, 3, 90, 9, {area: [0, base1 - alt1 - 200, W, alt1 + 300], cor: 'rgba(255,140,60,0.9)', tam: [1, 2.4], brilho: 0.7});
}

function marca(c, x, y, tam, {lema = true, lemaTam = 26} = {}) {
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0,0,0,0.85)'; c.shadowBlur = tam * 0.3;
  c.font = `700 ${tam}px Oswald`; c.fillStyle = PAL.texto; c.fillText(NOME, x, y);
  c.shadowBlur = 0;
  const lw = c.measureText(NOME).width * 0.62;
  c.fillStyle = PAL.vermelhoVivo; c.fillRect(x - lw / 2, y + tam * 0.6, lw, Math.max(4, tam * 0.05));
  if (lema) {
    c.font = `600 ${lemaTam}px Inter`; c.fillStyle = 'rgba(242,239,233,0.88)';
    if ('letterSpacing' in c) c.letterSpacing = '3px';
    c.fillText(LEMA, x, y + tam * 0.6 + lemaTam * 1.9);
  }
  c.restore();
}

function capa() {
  const cv = document.createElement('canvas'); cv.width = 2560; cv.height = 1440; cv.id = 'capa';
  const c = cv.getContext('2d'); c.scale(4 / 3, 4 / 3);  // composição em 1920x1080
  fundoCidade(c, {base1: 720, alt1: 300, base2: 790, alt2: 210, corte: 1180});
  marca(c, W / 2, 522, 132);
  filme(c, 0, {vinheta: 0.5, grao: 0.04});
  document.body.appendChild(cv);
}

function perfil() {
  const cv = document.createElement('canvas'); cv.width = 800; cv.height = 800; cv.id = 'perfil';
  const c = cv.getContext('2d'); c.scale(800 / 1080, 800 / 1080); c.translate(-(W - 1080) / 2, 0);  // quadrado central
  fundoCidade(c, {base1: 900, alt1: 320, base2: 960, alt2: 220, corte: 960});
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.shadowColor = 'rgba(0,0,0,0.85)'; c.shadowBlur = 50;
  const [l1, l2] = NOME.includes(' ') ? [NOME.split(' ')[0], NOME.split(' ').slice(1).join(' ')] : [NOME, ''];
  c.font = '700 230px Oswald'; c.fillStyle = PAL.texto;
  c.fillText(l1, W / 2, l2 ? 395 : 500); if (l2) c.fillText(l2, W / 2, 690);
  c.shadowBlur = 0; c.fillStyle = PAL.vermelhoVivo; c.fillRect(W / 2 - 170, 535, 340, 14);
  c.restore();
  filme(c, 0, {vinheta: 0.35, grao: 0.03});
  document.body.appendChild(cv);
}
window.gerar = async () => { await document.fonts.load('700 100px Oswald'); await document.fonts.load('600 20px Inter'); capa(); perfil(); return true; };
</script></body></html>
